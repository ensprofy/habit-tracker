<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <h1>Habit Tracker</h1>
        <p class="subtitle">Build habits one day at a time.</p>
      </div>
      <button id="theme-toggle" type="button" class="nav-btn theme-btn"></button>
    </header>

    <nav class="week-nav" aria-label="Week navigation">
      <button id="week-prev" type="button" class="nav-btn" aria-label="Previous week">&lsaquo;</button>
      <p id="week-range" class="week-range" aria-live="polite"></p>
      <button id="week-next" type="button" class="nav-btn" aria-label="Next week">&rsaquo;</button>
      <button id="week-today" type="button" class="nav-btn today-btn">This week</button>
    </nav>

    <form id="add-form" class="add-form" autocomplete="off">
      <label for="habit-name" class="visually-hidden">New habit name</label>
      <input id="habit-name" type="text" placeholder="Add a habit, e.g. Drink water" maxlength="60" required>
      <button type="submit">Add</button>
    </form>

    <p id="message" class="message" role="status" aria-live="polite"></p>

    <div id="week-header" class="grid-row week-header" aria-hidden="true"></div>
    <ul id="habit-list" class="habit-list"></ul>
    <p id="empty-state" class="empty-state" hidden>No habits yet. Add your first one above.</p>

    <div id="insights" class="insights" hidden>
      <section class="panel" aria-labelledby="chart-title">
        <h2 id="chart-title">Progress this week</h2>
        <div id="chart"></div>
      </section>
      <section class="panel" aria-labelledby="stats-title">
        <h2 id="stats-title">Stats</h2>
        <div id="stats"></div>
      </section>
    </div>

    <section class="data-tools" aria-label="Backup">
      <button id="export-btn" type="button" class="nav-btn">Export CSV</button>
      <button id="import-btn" type="button" class="nav-btn">Import CSV</button>
      <input id="import-file" type="file" accept=".csv,text/csv" hidden>
    </section>
  </main>

  <script src="storage.js"></script>
  <script src="csv.js"></script>
  <script src="dates.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
