<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Habit Tracker</h1>
      <p class="subtitle">Build habits one day at a time.</p>
    </header>

    <nav class="week-nav" aria-label="Week navigation">
      <button id="week-prev" type="button" class="nav-btn" aria-label="Previous week">&lsaquo;</button>
      <p id="week-range" class="week-range" aria-live="polite"></p>
      <button id="week-next" type="button" class="nav-btn" aria-label="Next week">&rsaquo;</button>
      <button id="week-today" type="button" class="nav-btn today-btn">This week</button>
    </nav>

    <form id="add-form" class="add-form" autocomplete="off">
      <label for="habit-name" class="visually-hidden">New habit name</label>
      <input id="habit-name" type="text" placeholder="Add a habit, e.g. Drink water" maxlength="60" required>
      <button type="submit">Add</button>
    </form>

    <p id="message" class="message" role="status" aria-live="polite"></p>

    <div id="week-header" class="grid-row week-header" aria-hidden="true"></div>
    <ul id="habit-list" class="habit-list"></ul>
    <p id="empty-state" class="empty-state" hidden>No habits yet. Add your first one above.</p>
  </main>

  <script src="storage.js"></script>
  <script src="dates.js"></script>
  <script src="app.js"></script>
</body>
</html>
